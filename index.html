<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Neoterix One App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neoterix">
<style>
:root{--b:#1F3864;--a:#2E75B6;--bg:#F3F5F9;--t:#1d2433;--m:#667085;--r:#C62828;--g:#2E7D32;--y:#B26A00;--line:#E4E7EC}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:15px;-webkit-tap-highlight-color:transparent}
header{background:var(--b);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header .t{font-weight:700;font-size:16px} header .u{font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:14px;padding:6px 12px;font-size:13px}
main{padding:12px 12px 90px;max-width:860px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11px;color:var(--m)}
nav button.on{color:var(--b);font-weight:700} nav .i{display:block;font-size:20px;line-height:24px}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile2{background:#fff;border:0;border-radius:14px;padding:16px 12px;min-height:118px;text-align:left;box-shadow:0 1px 3px rgba(16,24,40,.1);display:flex;flex-direction:column;gap:4px;position:relative;font:inherit;color:var(--t)}
.tile2:active{background:#E8EEF8} .tile2 .ti{font-size:26px} .tile2 .tl{font-weight:700;font-size:16px} .tile2 .ts{font-size:12px;color:var(--m)} .tile2 .tb{position:absolute;top:10px;right:10px}
header .hb{display:flex;gap:6px;align-items:center} details.sub{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.card{background:#fff;border-radius:12px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lnk{color:#5aa9ff;text-decoration:underline;cursor:pointer;font-size:13px} .muted{color:var(--m);font-size:13px} .h{font-size:18px;font-weight:700;margin:6px 0 10px}
.name{font-weight:700;font-size:16px}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:10px;background:#E8EEF8;color:var(--b);white-space:nowrap}
.badge.red{background:#FDECEC;color:var(--r)} .badge.green{background:#E7F4EA;color:var(--g)} .badge.amber{background:#FFF3E0;color:var(--y)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:600;background:var(--a);color:#fff;margin-top:10px;cursor:pointer}
.btn.sec{background:#E8EEF8;color:var(--b)} .btn.red{background:var(--r)} .btn.green{background:var(--g)}
.btn:disabled{opacity:.5}
.two{display:flex;gap:8px} .two .btn{flex:1}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #CBD2DD;border-radius:9px;font-size:15px;background:#fff;color:var(--t);font-family:inherit}
textarea{min-height:64px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px} .chk input{width:22px;height:22px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px} @media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(16,24,40,.06)} .tile .v{font-size:20px;font-weight:700;color:var(--b)} .tile .k{font-size:12px;color:var(--m)}
.tbl{overflow-x:auto;background:#fff;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap} th:first-child,td:first-child{text-align:left} th{background:#E8EEF8;color:var(--b);font-weight:600}
.prog{display:flex;gap:3px;margin:10px 0 4px} .prog span{flex:1;height:7px;border-radius:4px;background:#DCE2EB} .prog span.d{background:var(--g)} .prog span.c{background:var(--a)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px} .chip{border:1px solid #CBD2DD;background:#fff;border-radius:16px;padding:7px 12px;font-size:13px;white-space:nowrap;cursor:pointer} .chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;display:none;max-width:90%;text-align:center}
.load{text-align:center;color:var(--m);padding:40px 10px}
.item{cursor:pointer}
.st{font-weight:700;margin:18px 0 8px;color:var(--b);font-size:15px}
.kv{display:grid;grid-template-columns:44% 56%;gap:6px 10px;font-size:14px} .kv .k{color:var(--m)}
.note{background:#FFF8E6;border-radius:9px;padding:10px;font-size:14px;margin:8px 0}
.note.ok{background:#E7F4EA} .note.bad{background:#FDECEC}
.login{max-width:380px;margin:40px auto}
.logo{font-size:24px;font-weight:800;color:var(--b);text-align:center;margin-bottom:4px}
.act{font-size:13px;border-bottom:1px solid var(--line);padding:7px 0} .act:last-child{border:0}
details summary{cursor:pointer;color:var(--a);font-weight:600;padding:6px 0}
nav button{font-size:10px} nav .i{font-size:18px}
.kitg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px} .kitg div{background:#F3F5F9;border-radius:8px;padding:6px} .kitg span{font-size:12px;color:var(--m)} .kitg input{padding:7px;margin-top:2px}
.b0{background:#E7F4EA;color:var(--g)} .b1{background:#FFF3E0;color:var(--y)} .b2{background:#FDECEC;color:var(--r)} .bn{background:#EEE;color:#555}
.qty{width:90px;text-align:right} .neg{color:var(--r);font-weight:700}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)} .ln:last-child{border:0} .ln .nm{flex:1;font-size:14px}
select.sm{width:auto;padding:7px;font-size:13px} .two select.sm{width:100%}
</style>
</head>
<body>
<header id="hdr" style="display:none"><div class="hb"><button id="hb_back" onclick="history.back()" aria-label="Back">←</button><div><div class="t">Neoterix One App</div><div class="u" id="who"></div></div></div><div class="hb"><button id="hb_home" onclick="go('home')">⌂ Home</button><button onclick="logout()">Logout</button></div></header>
<main id="app"><div class="load">Loading…</div></main>
<nav id="nav" style="display:none"></nav>
<div class="toast" id="toast"></div>
<script>
var S = {token: null, boot: null, tab: 'home', stage: '', q: '', scope: 'mine'};

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function inr(n) { n = Number(n || 0); return 'Rs ' + n.toLocaleString('en-IN', {maximumFractionDigits: 0}); }
function lakh(n) { n = Number(n || 0); if (Math.abs(n) >= 100000) return 'Rs ' + (n / 100000).toFixed(2) + ' L'; return inr(n); }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 3500); }
function set(html) { $('app').innerHTML = html; window.scrollTo(0, 0); }
function loading() { set('<div class="load">Loading…</div>'); }

var API = 'https://script.google.com/macros/s/AKfycbyNt8NTdEfR3ord2GOstNlQfjBJ5AAhwfO3aAha825QE0gCM-pR2PeTRFZoRTrOwu9q/exec';
function call(action, payload, ok, fail) {
  fetch(API, {method: 'POST', body: JSON.stringify({token: S.token, action: action, payload: payload || {}})})
    .then(function (r) { return r.text(); })
    .then(function (r) {
      var d;
      try { d = JSON.parse(r); } catch (e) { throw new Error('Server is not reachable. Try again in a minute.'); }
      if (d.error === 'SESSION') { store('tok', null); S.token = null; showLogin('Please log in again.'); return; }
      if (d.error) { toast(d.error); if (fail) fail(d); return; }
      ok(d);
    })
    .catch(function (e) { toast(navigator.onLine ? 'Network problem: ' + e.message : 'You are offline. Check mobile data.'); if (fail) fail({error: e.message}); });
}
// Show the last copy straight away, then refresh from the server (only re-draws if the data changed and the person is still on that screen).
function callFast(action, payload, cb) {
  var key = 'c_' + String(S.token).slice(0, 8) + '_' + action + '_' + JSON.stringify(payload || {}), seq = S.seq, old = store(key);
  if (old) { try { cb(JSON.parse(old), true); } catch (e) { old = null; } }
  call(action, payload, function (d) {
    var txt = JSON.stringify(d);
    try { store(key, txt); } catch (e) { }
    if (S.seq === seq && txt !== old) cb(d, false);
  });
}
function clearLocal() { try { Object.keys(localStorage).forEach(function (k) { if (/^(c_|boot_)/.test(k)) localStorage.removeItem(k); }); } catch (e) { } }
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }

// ---------------------------------------------------------------- login
function showLogin(msg) {
  $('hdr').style.display = 'none'; $('nav').style.display = 'none';
  set('<div class="login card"><div class="logo">Neoterix One App</div><div class="muted" style="text-align:center">UGES · Neoterix</div>' +
    (msg ? '<div class="note">' + esc(msg) + '</div>' : '') +
    '<label>Login ID or registered mobile</label><input id="lid" autocapitalize="none" autocomplete="username" placeholder="e.g. roma or 98xxxxxxxx">' +
    '<label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4–8 digits">' +
    '<button class="btn" id="lbtn" onclick="doLogin()">Log in</button></div>');
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
}
function doLogin() {
  var b = $('lbtn'); b.disabled = true; b.textContent = 'Checking…';
  call('login', {loginId: $('lid').value, pin: $('pin').value}, function (d) {
    S.token = d.token; store('tok', d.token);
    if (d.mustChange) showChangePin(true); else start();
  }, function () { b.disabled = false; b.textContent = 'Log in'; });
}
function showChangePin(first) {
  $('hdr').style.display = 'none'; $('nav').style.display = 'none';
  set('<div class="login card"><div class="h">' + (first ? 'Set your own PIN' : 'Change PIN') + '</div>' +
    '<div class="muted">Choose 4 to 8 digits. Do not share it with anyone.</div>' +
    '<label>New PIN</label><input id="p1" type="password" inputmode="numeric">' +
    '<label>Repeat new PIN</label><input id="p2" type="password" inputmode="numeric">' +
    '<button class="btn" onclick="savePin()">Save PIN</button>' + (first ? '' : '<button class="btn sec" onclick="start()">Cancel</button>') + '</div>');
}
function savePin() {
  if ($('p1').value !== $('p2').value) { toast('The two PINs do not match.'); return; }
  call('changePin', {pin: $('p1').value}, function () { toast('PIN saved.'); start(); });
}
function logout() { call('logout', {}, function () {}); clearLocal(); store('tok', null); S.token = null; showLogin(); }

// ---------------------------------------------------------------- shell
function start() {
  var bk = 'boot_' + String(S.token).slice(0, 8), cached = store(bk), shown = false;
  if (cached) { try { var cb = JSON.parse(cached); if (!cb.user.mustChange) { applyBoot(cb); shown = true; } } catch (e) { } }
  if (!shown) loading();
  call('boot', {}, function (d) {
    var txt = JSON.stringify(d);
    try { store(bk, txt); } catch (e) { }
    if (shown && txt === cached) return;
    if (shown) { S.boot = d; if (S.tab === 'home' && !d.portal) home(); return; }
    applyBoot(d);
  });
}
function applyBoot(d) {
  {
    S.boot = d;
    if (d.user.mustChange) { showChangePin(true); return; }
    if (d.user.referrerOnly) S.tab = 'earn';
    $('hdr').style.display = 'flex';
    if (d.portal) { $('who').textContent = d.user.name + ' · ' + d.user.typeName; $('hb_home').style.display = 'none'; pNav(); go(S.tab); return; }
    $('who').textContent = d.user.name + ' · ' + d.user.roles.map(function (r) { return d.roles[r] || r; }).join(', ');
    renderNav(); go(S.tab);
  }
}
function hasLine(retail) { return S.boot.verticals.some(function (v) { return retail ? v.line === 'Retail' : v.line !== 'Retail'; }); }
function renderNav() {
  var u = S.boot.user, tabs = [['work', '✓', 'My work']];
  if (u.referrerOnly) tabs = [['earn', '★', 'Refer & Earn']];
  else {
  if (u.canRefer) tabs.push(['earn', '★', 'Refer']);
  if (hasLine(false)) tabs.push(['cust', '☰', 'Customers']);
  if (hasLine(true)) tabs.push(['retail', '◆', 'Retail']);
  if (S.boot.warehouses.length) tabs.push(['stock', '▤', 'Stock']);
  tabs.push(['lead', '+', 'New']);
  if (u.mgr) tabs.push(['dash', '▦', 'Dashboard']);
  if (u.admin) tabs.push(['admin', '⚙', 'Users']);
  }
  $('nav').innerHTML = ''; $('nav').style.display = 'none';
}
function go(tab, fromHistory) {
  S.seq = (S.seq || 0) + 1;
  if (!fromHistory) { try { history.pushState({t: tab}, ''); } catch (e) {} }
  if (['dsr', 'svc', 'dsrteam', 'logins', 'home'].indexOf(tab) > -1) {
    if ($('hb_home')) $('hb_home').style.display = tab === 'home' ? 'none' : '';
    if (tab === 'home') { S.tab = 'home'; return home(); }
    S.tab = tab;
    return tab === 'dsr' ? dsrScreen() : tab === 'svc' ? svcScreen(false) : tab === 'dsrteam' ? dsrTeamScreen() : portalAdmin();
  }
  if ($('hb_home') && !(S.boot && S.boot.portal)) $('hb_home').style.display = '';
  S.tab = tab;
  if (S.boot && S.boot.portal) { var pb = document.querySelectorAll('nav button'); for (var j = 0; j < pb.length; j++) pb[j].className = ''; if ($('nb_' + tab)) $('nb_' + tab).className = 'on'; return pGo(tab); }
  var bs = document.querySelectorAll('nav button'); for (var i = 0; i < bs.length; i++) bs[i].className = '';
  if ($('nb_' + tab)) $('nb_' + tab).className = 'on';
  S.F = null; S.ST = null;
  if (tab === 'work') work(); else if (tab === 'cust') customers(); else if (tab === 'lead') newLead(); else if (tab === 'dash') dashboard(); else if (tab === 'admin') admin();
  else if (tab === 'retail') retail(); else if (tab === 'stock') stock(); else if (tab === 'earn') earn();
}
function stageBadge(stage, overdue) {
  var cls = stage === 'Closed - Complete' ? 'green' : (stage === 'Cancelled' ? 'red' : '');
  return '<span class="badge ' + cls + '">' + esc(stage) + '</span>' + (overdue ? ' <span class="badge red">Overdue</span>' : '');
}
function due(d) {
  if (!d) return '';
  var now = new Date(), t = new Date(d.replace(' ', 'T') + ':00+05:30'), h = Math.round((t - now) / 3600000);
  if (h < 0) return 'overdue by ' + (h > -48 ? (-h) + ' h' : Math.round(-h / 24) + ' days');
  return 'due in ' + (h < 48 ? h + ' h' : Math.round(h / 24) + ' days');
}

// ---------------------------------------------------------------- my work
function work() {
  loading();
  callFast('myWork', {scope: S.scope}, function (d) {
    var u = S.boot.user, h = '';
    if (u.mgr) h += '<div class="chips"><span class="chip ' + (S.scope === 'mine' ? 'on' : '') + '" onclick="S.scope=\'mine\';work()">My tasks</span><span class="chip ' + (S.scope === 'team' ? 'on' : '') + '" onclick="S.scope=\'team\';work()">Whole team</span></div>';
    var over = d.tasks.filter(function (t) { return t.Overdue; }).length;
    h += '<div class="h">' + (S.scope === 'team' ? 'Team work' : 'My work') + ' · ' + d.tasks.length + '</div>';
    if (over) h += '<div class="note bad">' + over + ' task' + (over > 1 ? 's are' : ' is') + ' overdue.</div>';
    if (d.service) h += '<div class="card item" onclick="svcScreen(false)"><div class="row"><b>Service requests</b><span class="badge ' + (d.service ? 'amber' : '') + '">' + (d.service || 0) + ' open</span></div></div>';
    if (d.dsr && d.dsr.pending) h += '<div class="card item" onclick="dsrScreen()"><div class="row"><b>Daily sales summary</b><span class="badge ' + (d.dsr.pending ? 'amber' : 'green') + '">' + (d.dsr.pending ? d.dsr.pending + ' to fill today' : 'Done today') + '</span></div></div>';

    if ((d.payApprovals || []).length) {
      h += '<div class="st">Payments to approve · ' + d.payApprovals.length + '</div>';
      d.payApprovals.forEach(function (r) { h += payReqCard(r); });
    }
    if ((d.retApprovals || []).length) {
      h += '<div class="st">Retailer deletions to approve · ' + d.retApprovals.length + '</div>';
      d.retApprovals.forEach(function (r) { h += retDelCard(r); });
    }
    if (!d.tasks.length && !(d.follow || []).length && !(d.approvals || []).length && !(d.payApprovals || []).length && !(d.retApprovals || []).length) h += '<div class="card muted">Nothing waiting on you right now.</div>';
    if ((d.approvals || []).length) {
      h += '<div class="st">Stock entries to approve · ' + d.approvals.length + '</div>';
      d.approvals.forEach(function (r) { h += reqCard(r, true); });
      if (d.tasks.length || (d.follow || []).length) h += '<div class="st">&nbsp;</div>';
    }
    if ((d.follow || []).length) {
      h += '<div class="st">Retailer follow-ups due · ' + d.follow.length + '</div>';
      d.follow.forEach(function (r) {
        h += '<div class="card item" onclick="openRetailer(\'' + r.RetailerID + '\')"><div class="row"><div class="name">' + esc(r.Name) + '</div><span class="badge amber">Follow up ' + esc(r.NextFollowUp) + '</span></div>' +
          '<div class="muted">' + esc(r.Area || '') + (r.LastOrder ? ' · last order ' + esc(r.LastOrder) + ' (' + r.Days + ' d)' : ' · no order yet') + (S.scope === 'team' ? ' · ' + esc(r.SalesExec) : '') + '</div>' + (r.FollowUpNote ? '<div class="muted">' + esc(r.FollowUpNote) + '</div>' : '') + '</div>';
      });
      if (d.tasks.length) h += '<div class="st">Tasks</div>';
    }
    d.tasks.forEach(function (t) {
      var o = t.order;
      h += '<div class="card item" onclick="openOrder(\'' + o.OrderID + '\')"><div class="row"><div class="name">' + esc(o.CustomerName) + '</div>' + stageBadge(t.Stage, t.Overdue) + '</div>' +
        '<div style="margin:6px 0">' + esc(t.Title) + '</div>' +
        '<div class="row muted"><span>' + (o.kind === 'retail' ? 'Retail · ' + esc(o.KitMix || '') : esc(o.CapacityKW ? o.CapacityKW + ' kW' : '') + (o.PaymentMode ? ' · ' + esc(o.PaymentMode) : '') + (o.City ? ' · ' + esc(o.City) : '')) + '</span><span>' + due(t.DueAt) + '</span></div>' +
        (S.scope === 'team' ? '<div class="muted">Owner: ' + esc(t.OwnerName) + '</div>' : '') + '</div>';
    });
    set(h);
  });
}

// ---------------------------------------------------------------- customers
function customers() {
  S.cf = S.cf || ''; S.cs = S.cs || 'stage'; S.cr = S.cr || '';
  var h = '<input id="q" placeholder="Search name, mobile, city, order ID" value="' + esc(S.q) + '">' +
    '<div class="chips" style="margin-top:8px">' + CUST_FILTERS.map(function (f) { return '<span class="chip ' + (S.cf === f[0] ? 'on' : '') + '" onclick="S.cf=\'' + f[0] + '\';S.cr=\'\';customers()">' + f[1] + '</span>'; }).join('') + '</div>';
  if (S.cf === 'due') h += '<div class="chips"><span class="chip ' + (!S.cr ? 'on' : '') + '" onclick="S.cr=\'\';customers()">Any reason</span>' + S.boot.dueReasons.map(function (r, i) { return '<span class="chip ' + (S.cr === r ? 'on' : '') + '" onclick="S.cr=S.boot.dueReasons[' + i + '];customers()">' + esc(r.replace('Payment hold due to ', '').replace('Pendency ', '')) + '</span>'; }).join('') + '</div>';
  var ev = S.boot.verticals.filter(function (v) { return v.line !== 'Retail'; });
  if (S.cv === undefined) { try { S.cv = localStorage.getItem('cv_' + S.boot.user.name) || ''; } catch (e) { S.cv = ''; } }
  if (S.cv && !ev.some(function (v) { return v.id === S.cv; })) S.cv = '';
  if (ev.length > 1) h += '<select id="c_vert" style="margin:10px 0 14px;font-weight:600" onchange="setCv(this.value)"><option value="">All my verticals</option>' + ev.map(function (v) { return '<option value="' + v.id + '"' + (S.cv === v.id ? ' selected' : '') + '>' + esc(v.id + ' ' + v.name) + '</option>'; }).join('') + '</select>';
  h += '<div class="two"><select id="c_stage" onchange="S.stage=this.value;loadList()"><option value="">All stages</option>' + S.boot.stages.map(function (s) { return '<option' + (S.stage === s.code ? ' selected' : '') + '>' + esc(s.code) + '</option>'; }).join('') + '</select>' +

  var h = '<div class="h">Hello ' + esc(S.boot.user.name.split(' ')[0]) + '</div><div class="home">' + homeTiles().map(function (x) {
    return '<button class="tile2" onclick="go(\'' + x[0] + '\')"><span class="ti">' + x[1] + '</span><span class="tl">' + esc(x[2]) + '</span><span class="ts">' + esc(x[3]) + '</span><span class="tb" id="tb_' + x[0] + '"></span></button>';
  }).join('') + '</div>';
  set(h);
  if (S.boot.user.referrerOnly) return;
  callFast('myWork', {scope: 'mine'}, function (d) {
    var b = function (id, n, cls) { if ($('tb_' + id) && n) $('tb_' + id).innerHTML = '<span class="badge ' + (cls || 'amber') + '">' + n + '</span>'; };
    b('work', d.tasks.length + (d.approvals || []).length + (d.payApprovals || []).length + (d.retApprovals || []).length + (d.follow || []).length, d.tasks.some(function (t) { return t.Overdue; }) ? 'red' : 'amber');
    b('svc', d.service); if (d.dsr) b('dsr', d.dsr.pending ? d.dsr.pending + ' to fill' : '');
  }, function () {});
}
window.addEventListener('popstate', function (e) {
  if (!S.boot) return;
  var st = e.state;
  go(st && st.t ? st.t : 'home', true);
});
// ---- customers list: filters and sorting
var CUST_FILTERS = [['', 'All active'], ['mine', 'My orders'], ['due', 'Payment due'], ['overdue', 'Overdue'], ['callback', 'Call-backs due'], ['Hot', 'Hot'], ['Warm', 'Warm'], ['Cold', 'Cold']];
var CUST_SORTS = [['stage', 'Stage'], ['days', 'Days stuck (most first)'], ['balance', 'Balance due (highest)'], ['value', 'Order value (highest)'], ['newest', 'Newest first'], ['callback', 'Call-back date']];
function lead1Box(o, t, d) {
  return '<details class="sub"><summary>Call back later (park Warm / Cold lead)</summary><div id="pk_box"><label>Lead quality</label><select id="pk_t"><option>Warm</option><option>Cold</option><option>Hot</option></select>' +
    '<label>Call back on</label><input id="pk_d" type="date" value="' + new Date(Date.now() + 3 * 864e5).toISOString().slice(0, 10) + '"><label>Note</label><input id="pk_n" placeholder="e.g. will decide after Diwali">' +
    '<button class="btn sec" onclick="parkLead()">Park lead</button></div></details>' +
    '<details class="sub"><summary>Not interested – close lead</summary><label>Reason</label><select id="dr_r">' + d.dropReasons.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' +
    '<label>Note</label><input id="dr_n"><button class="btn sec" style="color:var(--r)" onclick="dropLead()">Close lead</button></details>';
}
function parkLead() { call('parkLead', {id: S.cur, temp: $('pk_t').value, date: $('pk_d').value, note: $('pk_n').value}, function () { toast('Lead parked – it will come back on the call-back date.'); openOrder(S.cur); }); }
function dropLead() { call('dropLead', {id: S.cur, reason: $('dr_r').value, note: $('dr_n').value}, function () { toast('Lead closed.'); go(S.tab); }); }
function saveDueReason() { call('saveOrder', {id: S.cur, values: {DueReason: $('due_r').value}}, function () { toast('Saved.'); openOrder(S.cur); }); }
function moveHistory() {
  var d = S.stk;
  set('<button class="chip" onclick="stock()">← Stock</button><div class="h" style="margin-top:8px">' + esc(d.warehouse.name) + ' · history</div><input id="mh_q" placeholder="Search item, party, invoice, serial"><div id="mh" class="card" style="margin-top:8px"><div class="load">Loading…</div></div>');
  var load = function () { call('moves', {wh: d.warehouse.id, q: $('mh_q').value}, function (r) { $('mh').innerHTML = r.moves.length ? r.moves.map(function (m) { return '<div class="ln"><span class="nm">' + esc(m.Item) + '<div class="muted">' + esc(m.Date) + ' · ' + esc(m.Type) + (m.Party ? ' · ' + esc(m.Party) : '') + (m.InvoiceNo ? ' · ' + esc(m.InvoiceNo) : '') + (m.By ? ' · by ' + esc(m.By) : '') + (m.Serials ? '<br>SN: ' + esc(m.Serials) : '') + '</div></span><b class="' + (m.Qty < 0 ? 'neg' : '') + '">' + (m.Qty > 0 ? '+' : '') + m.Qty + '</b></div>'; }).join('') : '<span class="muted">No entries.</span>'; }); };
  var t; $('mh_q').addEventListener('input', function () { clearTimeout(t); t = setTimeout(load, 500); }); load();
}
function addItem() { call('saveItem', {Name: $('ni_name').value, Category: $('ni_cat').value, Unit: $('ni_unit').value}, function () { toast('Item added.'); stock(); }); }

// ---------------------------------------------------------------- go
S.token = store('tok');
if (S.token) start(); else showLogin();
</script>
